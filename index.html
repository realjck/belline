<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0c0a08">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Belline Oracle - Card Reading Companion</title>
  <meta name="description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Belline Oracle - Card Reading Companion">
  <meta property="og:description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Belline Oracle - Card Reading Companion">
  <meta name="twitter:description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
  <link href="./assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

<div id="main">

<!-- ── Shared header ── -->
<header class="hdr">
  <div class="hdr-left">
    <button class="hdr-home hidden" id="bt-home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1H15v-5h-6v5H4a1 1 0 01-1-1V10.5z"/>
      </svg>
    </button>
  </div>
  <div class="hdr-right">
    <button class="hdr-btn" id="bt-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <button class="hdr-btn" id="bt-info" aria-label="Info">i</button>
    <button class="hdr-btn" id="bt-theme" aria-label="Theme">&#9790;</button>
  </div>
</header>

<div id="app">

  <!-- ── Screens ── -->
  <div id="screens">

    <!-- SCREEN 0 — HOME -->
    <div class="screen active" id="s-home">
      <div class="home-body">
        <div class="home-title" id="home-title"></div>
        <img class="home-logo" src="./assets/images/belline-logo.png" alt="Belline Oracle logo">
        <div class="home-sub" id="home-subtitle"></div>
        <button class="btn-start" id="bt-start"></button>
      </div>
    </div>

    <!-- SCREEN 1 — CARDS GALLERY -->
    <div class="screen" id="s-cards">
      <div class="cards-gallery" id="cards-gallery"></div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-cards-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 2 — LARGE CARD VIEW -->
    <div class="screen" id="s-card-large">
      <div class="card-large-header" id="card-large-header"></div>
      <div class="card-large-container">
        <img class="card-large-image" id="card-large-image" src="" alt="">
      </div>
      <div class="card-large-info">
        <div class="card-large-planet" id="card-large-planet"></div>
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arr" id="arr-next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 3 — CARD TEXT VIEW -->
    <div class="screen" id="s-card-text">
      <div id="card-text-content"></div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-prev-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn-action primary" id="bt-text-back"></button>
        <span class="nav-spacer"></span>
      </div>
    </div>

  </div><!-- /#screens -->

  <!-- ── Modal settings ── -->
  <div class="modal-overlay modal-centered" id="modal-settings">
    <div class="modal-sheet modal-settings-sheet">
      <div class="modal-title" id="modal-settings-title"></div>
      <div class="sep"></div>
      <div class="settings-row">
        <span class="settings-label" id="settings-lang-label"></span>
        <div class="settings-opts">
          <button class="settings-opt settings-lang-opt" id="settings-lang-en"></button>
          <button class="settings-opt settings-lang-opt" id="settings-lang-fr"></button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label" id="settings-sound-label"></span>
        <div class="settings-opts">
          <button class="settings-opt settings-sound-opt" id="settings-sound-on"></button>
          <button class="settings-opt settings-sound-opt" id="settings-sound-off"></button>
        </div>
      </div>
      <button class="modal-close" id="bt-settings-close"></button>
    </div>
  </div>

  <!-- ── Modal info ── -->
  <div class="modal-overlay" id="modal-info">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-info-title"></div>
      <div class="sep"></div>
      <div class="modal-body" id="modal-info-body"></div>
      <button class="modal-close" id="bt-modal-close"></button>
    </div>
  </div>

</div><!-- /#app -->

</div><!-- /#main -->

<script src="./assets/libs/marked/marked.min.js"></script>
<script src="./assets/data/ui-texts.js"></script>
<script src="./assets/data/belline-cards.js"></script>
<script src="./assets/app/app.js"></script>

</body>
</html>
