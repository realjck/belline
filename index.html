<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0c0a08">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Belline Oracle - Card Reading Companion</title>
  <meta name="description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Belline Oracle - Card Reading Companion">
  <meta property="og:description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Belline Oracle - Card Reading Companion">
  <meta name="twitter:description" content="The Belline Oracle app is your digital companion for card readings using the Belline deck.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
  <link href="./assets/css/style.css" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

<div id="main">

<!-- ── Shared header ── -->
<header class="hdr">
  <div class="hdr-left">
    <button class="hdr-home hidden" id="bt-home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1H15v-5h-6v5H4a1 1 0 01-1-1V10.5z"/>
      </svg>
    </button>
  </div>
  <div class="hdr-right">
    <button class="hdr-btn" id="bt-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <button class="hdr-btn" id="bt-info" aria-label="Info">i</button>
    <button class="hdr-btn" id="bt-theme" aria-label="Theme">&#9790;</button>
  </div>
</header>

<div id="app">

  <!-- ── Screens ── -->
  <div id="screens">

    <!-- SCREEN 0 — HOME -->
    <div class="screen active" id="s-home">
      <div class="home-body">
        <div class="home-title" id="home-title"></div>
        <img class="home-logo" src="./assets/images/belline-logo.png" alt="Belline Oracle logo">
        <div class="home-sub" id="home-subtitle"></div>
        <div class="home-buttons">
          <button class="btn-start" id="bt-start"></button>
          <button class="btn-start" id="bt-tirage"></button>
        </div>
      </div>
    </div>

    <!-- SCREEN 1 — CARDS GALLERY -->
    <div class="screen" id="s-cards">
      <div class="cards-gallery" id="cards-gallery"></div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-cards-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 2 — LARGE CARD VIEW -->
    <div class="screen" id="s-card-large">
      <div class="card-large-header" id="card-large-header"></div>
      <div class="card-large-container">
        <img class="card-large-image" id="card-large-image" src="" alt="">
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arr" id="arr-next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 3 — CARD TEXT VIEW -->
    <div class="screen" id="s-card-text">
      <div id="card-text-content"></div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-prev-text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 4 — TIRAGE CHOIX -->
    <div class="screen" id="s-tirage-choix">
      <div class="tirage-body">
        <button class="btn-action" id="bt-une-carte"></button>
        <button class="btn-action" id="bt-tirage-croix"></button>
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-tirage-choix-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="nav-spacer"></span>
      </div>
    </div>

    <!-- SCREEN 5 — TIRAGE DOMAINE -->
    <div class="screen" id="s-tirage-domaine">
      <div class="tirage-body">
        <div class="tirage-domaine-title" id="tirage-domaine-title"></div>
        <button class="btn-action btn-domain" data-domain="amour">
          <span class="domain-glyph">♡</span>
          <span class="domain-label" data-key="domain-amour"></span>
        </button>
        <button class="btn-action btn-domain" data-domain="travail">
          <span class="domain-glyph">⌬</span>
          <span class="domain-label" data-key="domain-travail"></span>
        </button>
        <button class="btn-action btn-domain" data-domain="argent">
          <span class="domain-glyph">❖</span>
          <span class="domain-label" data-key="domain-argent"></span>
        </button>
        <button class="btn-action btn-domain" data-domain="famille">
          <span class="domain-glyph">ᗑ</span>
          <span class="domain-label" data-key="domain-famille"></span>
        </button>
        <button class="btn-action btn-domain" data-domain="spiritualite">
          <span class="domain-glyph">☸︎</span>
          <span class="domain-label" data-key="domain-spiritualite"></span>
        </button>
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-tirage-domaine-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="nav-spacer"></span>
      </div>
    </div>

    <!-- SCREEN 6 — TIRAGE CHIFFRE -->
    <div class="screen" id="s-tirage-chiffre">
      <div class="tirage-body tirage-chiffre-body">
        <div class="position-title hidden" id="croix-position-title"></div>
        <div class="tirage-chiffre-title" id="tirage-chiffre-title"></div>
        <div id="tirage-animation">
          <div class="tirage-anim">
            <div class="ta-disc"></div>
            <div class="ta-ticks" id="ta-ticks"></div>
            <div class="ta-ring ta-r3"></div>
            <div class="ta-ring ta-r2"></div>
            <div class="ta-ring ta-r1"></div>
            <div class="ta-orbit ta-sun">
              <div class="ta-body">
                <div class="ta-sun-icon">
                  <div class="ta-core"></div>
                  <div class="ta-ray"></div>
                  <div class="ta-ray"></div>
                  <div class="ta-ray"></div>
                  <div class="ta-ray"></div>
                </div>
              </div>
            </div>
            <div class="ta-orbit ta-moon">
              <div class="ta-body">
                <div class="ta-moon-icon"></div>
              </div>
            </div>
            <div class="ta-orbit ta-star" style="--ta-dur:1.75s; --ta-dir:normal; --ta-r:var(--ta-orbit-1);">
              <div class="ta-body"><div class="ta-star-icon" style="--ta-s:9px;"></div></div>
            </div>
            <div class="ta-orbit ta-star" style="--ta-dur:1.75s; --ta-dir:normal; --ta-r:var(--ta-orbit-1); animation-delay:-0.875s;">
              <div class="ta-body" style="animation-delay:-0.875s;"><div class="ta-star-icon" style="--ta-s:7px;"></div></div>
            </div>
            <div class="ta-orbit ta-star" style="--ta-dur:3.5s; --ta-dir:reverse; --ta-r:var(--ta-orbit-3); animation-delay:-0.5s;">
              <div class="ta-body" style="animation-delay:-0.5s;"><div class="ta-star-icon" style="--ta-s:8px;"></div></div>
            </div>
            <div class="ta-orbit ta-star" style="--ta-dur:3.5s; --ta-dir:reverse; --ta-r:var(--ta-orbit-3); animation-delay:-2s;">
              <div class="ta-body" style="animation-delay:-2s;"><div class="ta-star-icon" style="--ta-s:6px;"></div></div>
            </div>
            <div class="ta-orbit ta-star" style="--ta-dur:3.5s; --ta-dir:reverse; --ta-r:var(--ta-orbit-3); animation-delay:-2.75s;">
              <div class="ta-body" style="animation-delay:-2.75s;"><div class="ta-star-icon" style="--ta-s:7px;"></div></div>
            </div>
            <div class="ta-card-wrap">
              <div class="ta-card">
                <div class="ta-card-face ta-front"></div>
                <div class="ta-card-face ta-back"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="tirage-numbers" id="tirage-numbers">
          <div class="tirage-numbers-row">
            <button class="nav-arr num-btn" data-num="1">1</button>
            <button class="nav-arr num-btn" data-num="2">2</button>
            <button class="nav-arr num-btn" data-num="3">3</button>
            <button class="nav-arr num-btn" data-num="4">4</button>
            <button class="nav-arr num-btn" data-num="5">5</button>
          </div>
          <div class="tirage-numbers-row">
            <button class="nav-arr num-btn" data-num="6">6</button>
            <button class="nav-arr num-btn" data-num="7">7</button>
            <button class="nav-arr num-btn" data-num="8">8</button>
            <button class="nav-arr num-btn" data-num="9">9</button>
          </div>
        </div>
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-tirage-chiffre-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="nav-spacer"></span>
      </div>
    </div>

    <!-- SCREEN 7 — TIRAGE ANIMATION -->
    <div class="screen tirage-anim-screen" id="s-tirage-anim">
      <div class="tc-stage" id="tc-deck"></div>
    </div>

    <!-- SCREEN 8 — TIRAGE REVEAL -->
    <div class="screen" id="s-tirage-reveal">
      <div class="tirage-body tirage-reveal-body">
        <div id="reveal-header" class="reveal-header"></div>
        <div class="reveal-card-wrapper">
          <img id="reveal-card-img" class="reveal-card-img" alt="">
        </div>
        <div id="reveal-croix-position" class="reveal-croix-position hidden"></div>
        <p id="reveal-text" class="reveal-text"></p>
      </div>
      <div class="bottom-nav reveal-bottom-nav">
        <button class="nav-arr" id="arr-reveal-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn-action" id="bt-nouveau-tirage"></button>
        <button class="nav-arr" id="arr-reveal-next" aria-label="Next" style="visibility:hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN 9 — TIRAGE CROIX RECAP -->
    <div class="screen" id="s-tirage-croix-recap">
      <div class="croix-recap-body">
        <div class="croix-recap-title" id="croix-recap-title"></div>
        <div class="croix-recap-subtitle" id="croix-recap-subtitle"></div>
        <div class="croix-grid" id="croix-grid"></div>
      </div>
      <div class="bottom-nav">
        <button class="nav-arr" id="arr-croix-recap-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn-action" id="bt-croix-nouveau-tirage"></button>
        <span class="nav-spacer"></span>
      </div>
    </div>

  </div><!-- /#screens -->

  <!-- ── Modal settings ── -->
  <div class="modal-overlay modal-centered" id="modal-settings">
    <div class="modal-sheet modal-settings-sheet">
      <div class="modal-title" id="modal-settings-title"></div>
      <div class="sep"></div>
      <div class="settings-row">
        <span class="settings-label" id="settings-lang-label"></span>
        <div class="settings-opts">
          <button class="settings-opt settings-lang-opt" id="settings-lang-en"></button>
          <button class="settings-opt settings-lang-opt" id="settings-lang-fr"></button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label" id="settings-sound-label"></span>
        <div class="settings-opts">
          <button class="settings-opt settings-sound-opt" id="settings-sound-on"></button>
          <button class="settings-opt settings-sound-opt" id="settings-sound-off"></button>
        </div>
      </div>
      <button class="modal-close" id="bt-settings-close"></button>
    </div>
  </div>

  <!-- ── Modal info ── -->
  <div class="modal-overlay" id="modal-info">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modal-info-title"></div>
      <div class="sep"></div>
      <div class="modal-body" id="modal-info-body"></div>
      <button class="modal-close" id="bt-modal-close"></button>
    </div>
  </div>

</div><!-- /#app -->

</div><!-- /#main -->

<script src="./assets/libs/marked/marked.min.js"></script>
<script src="./assets/data/ui-texts.js"></script>
<script src="./assets/data/belline-cards.js"></script>
<script src="./assets/app/app.js"></script>

</body>
</html>
